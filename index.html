<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RM Manager - Pro Edition</title>
  <style>
    :root {
      --bg-dark: #0b132b;
      --panel-bg: #1c2541;
      --accent: #48cae4;
      --accent-bright: #00b4d8;
      --text: #edf2f4;
      --success: #38b000;
      --danger: #d90429;
      --pitch-green: #1e5631;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text); padding: 20px; }

    header { text-align: center; margin-bottom: 20px; padding-bottom: 10px; border-bottom: 2px solid var(--panel-bg); }
    header h1 { color: var(--accent); font-size: 2.2rem; }

    .container { max-width: 1300px; margin: 0 auto; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
    @media (max-width: 1024px) { .container { grid-template-columns: 1fr; } }

    .panel { background: var(--panel-bg); border-radius: 10px; padding: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); margin-bottom: 15px; }
    h2 { margin-bottom: 12px; font-size: 1.1rem; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }

    .btn { background-color: var(--accent); color: #000; border: none; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
    .btn:hover { background-color: var(--accent-bright); color: #fff; }
    .btn-danger { background-color: var(--danger); color: #fff; }
    .btn-large { width: 100%; padding: 14px; font-size: 1.1rem; background: linear-gradient(135deg, #00b4d8, #7209b7); color: #fff; border: none; border-radius: 8px; cursor: pointer; }

    select, input { padding: 8px; border-radius: 6px; background: #0b132b; color: #fff; border: 1px solid #3a506b; width: 100%; margin-bottom: 10px; }

    table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid #3a506b; }
    th { background-color: #0b132b; color: #8d99ae; }

    .badge { padding: 3px 6px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-ucl { background: #03045e; color: #caf0f8; }

    /* TAKTİK MEYDANÇA */
    .pitch { background: var(--pitch-green); border-radius: 8px; padding: 15px; min-height: 380px; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #a3b18a; margin-bottom: 15px; position: relative; }
    .pitch-row { display: flex; justify-content: space-around; gap: 5px; }
    .player-card { background: rgba(11, 19, 43, 0.85); border-radius: 6px; padding: 6px 10px; font-size: 0.75rem; text-align: center; cursor: pointer; border: 1px solid var(--accent); transition: 0.2s; min-width: 80px; }
    .player-card:hover { transform: scale(1.05); background: rgba(0, 180, 216, 0.9); color: #000; }

    #selectionScreen { display: block; max-width: 450px; margin: 40px auto; }
    #gameScreen { display: none; }
  </style>
</head>
<body>

  <header>
    <h1>⚽ RM MANAGER</h1>
    <p>Professional Football Strategy & Management</p>
  </header>

  <!-- 1. SEÇİM EKRANI -->
  <div id="selectionScreen" class="panel">
    <h2>Karyeraya Başla</h2>
    <label>Ölkə Seçin:</label>
    <select id="selectCountry" onchange="updateTeamDropdown()">
      <option value="AZ">Azərbaycan (Rank 26)</option>
      <option value="TR">Türkiyə (Rank 9)</option>
      <option value="ENG">İngiltərə (Rank 1)</option>
    </select>

    <label>Komanda Seçin:</label>
    <select id="selectTeam"></select>

    <button class="btn btn-large" style="margin-top: 10px;" onclick="startGame()">Komandanı Təhvil Al ▶</button>
  </div>

  <!-- 2. ƏSAS OYUN EKRANI -->
  <div id="gameScreen">
    <button class="btn btn-large" onclick="playNextRound()">▶ Növbəti Haftanın Matçlarını Oyna (Mövsüm Simulyasiyası)</button>

    <div class="container">
      <!-- SOL SÜTUN: Taktika və Heyət -->
      <div>
        <div class="panel">
          <h2>
            <span>📋 İlk 11-lik (Sahədəki Oyunçunun üstünə klikləyib çıxar)</span>
          </h2>

          <div class="pitch" id="pitchDisplay"></div>

          <h3 style="font-size: 0.9rem; color: var(--accent); margin-bottom: 6px;">Ehtiyat Oyunçular (Substitutes)</h3>
          <table>
            <thead>
              <tr><th>Ad</th><th>Möq</th><th>Yaş</th><th>OVR</th><th>POT</th><th>Əməl</th></tr>
            </thead>
            <tbody id="benchTable"></tbody>
          </table>
        </div>

        <!-- TRANSFER BAZARI -->
        <div class="panel">
          <h2>🛒 Transfer Bazarı <span id="userBudget" style="color: var(--success);">$0M</span></h2>
          <input type="text" id="searchInput" placeholder="Oyunçu adı, klub və ya mövqe axtar..." onkeyup="filterMarket()">
          <div style="max-height: 250px; overflow-y: auto;">
            <table>
              <thead>
                <tr><th>Ad</th><th>Klub</th><th>Möq</th><th>OVR</th><th>Qiymət</th><th>Əməl</th></tr>
              </thead>
              <tbody id="transferMarketTable"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- SAĞ SÜTUN: Cədvəl və Nəticələr -->
      <div>
        <div class="panel">
          <h2>
            <span>Liqa Cədvəli</span>
            <span id="currentLeagueName" class="badge badge-ucl"></span>
          </h2>
          <table>
            <thead>
              <tr><th>#</th><th>Klub</th><th>O</th><th>Q</th><th>H</th><th>M</th><th>X</th></tr>
            </thead>
            <tbody id="leagueStandingsTable"></tbody>
          </table>
        </div>

        <div class="panel">
          <h2>⚽ Matç Nəticələri və Qollar</h2>
          <div id="matchResults" style="font-size: 0.85rem; display: flex; flex-direction: column; gap: 8px; max-height: 300px; overflow-y: auto;"></div>
        </div>
      </div>
    </div>
  </div>

    let userTeam = null;
    let userCountry = null;

    function updateTeamDropdown() {
      const cId = document.getElementById("selectCountry").value;
      const country = db.countries.find(c => c.id === cId);
      const select = document.getElementById("selectTeam");
      select.innerHTML = "";
      country.teams.forEach(t => {
        select.innerHTML += `<option value="${t.id}">${t.name} (Büdcə: $${t.budget}M)</option>`;
      });
    }

    function startGame() {
      const cId = document.getElementById("selectCountry").value;
      const tId = parseInt(document.getElementById("selectTeam").value);

      userCountry = db.countries.find(c => c.id === cId);
      userTeam = userCountry.teams.find(t => t.id === tId);

      document.getElementById("selectionScreen").style.display = "none";
      document.getElementById("gameScreen").style.display = "block";
      document.getElementById("currentLeagueName").innerText = userCountry.league;

      updateUI();
    }

    function calculateTeamRating(team) {
      const starting11 = team.squad.filter(p => p.inStarting11);
      if (starting11.length === 0) return 60;
      const sum = starting11.reduce((acc, p) => acc + p.rating, 0);
      return Math.round(sum / starting11.length);
    }

    function updateUI() {
      document.getElementById("userBudget").innerText = `$${userTeam.budget.toFixed(1)}M`;
      renderPitch();
      renderBench();
      renderMarket();
      renderStandings();
    }

    function renderPitch() {
      const pitch = document.getElementById("pitchDisplay");
      pitch.innerHTML = "";

      const starting11 = userTeam.squad.filter(p => p.inStarting11);
      
      const rowFW = document.createElement("div"); rowFW.className = "pitch-row";
      const rowMF = document.createElement("div"); rowMF.className = "pitch-row";
      const rowDF = document.createElement("div"); rowDF.className = "pitch-row";
      const rowGK = document.createElement("div"); rowGK.className = "pitch-row";

      starting11.forEach(p => {
        const card = document.createElement("div");
        card.className = "player-card";
        card.innerHTML = `<b>${p.name}</b><br>${p.pos} | ${p.rating}`;
        card.title = "Ehtiyatlara keçirmək üçün klikləyin";
        card.onclick = () => {
          p.inStarting11 = false;
          updateUI();
        };

        if(["ST", "LW", "RW", "CF"].includes(p.pos)) rowFW.appendChild(card);
        else if(["CAM", "CM", "CDM", "LM", "RM"].includes(p.pos)) rowMF.appendChild(card);
        else if(p.pos === "GK") rowGK.appendChild(card);
        else rowDF.appendChild(card);
      });

      pitch.appendChild(rowFW);
      pitch.appendChild(rowMF);
      pitch.appendChild(rowDF);
      pitch.appendChild(rowGK);
    }

    function renderBench() {
      const tbody = document.getElementById("benchTable");
      tbody.innerHTML = "";
      const bench = userTeam.squad.filter(p => !p.inStarting11);

      bench.forEach(p => {
        tbody.innerHTML += `
          <tr>
            <td><b>${p.name}</b></td>
            <td>${p.pos}</td>
            <td>${p.age}</td>
            <td>${p.rating}</td>
            <td style="color: var(--accent);">${p.potential}</td>
            <td><button class="btn" onclick="moveToStarting11('${p.name}')">11-liyə sal</button></td>
          </tr>
        `;
      });
    }

    function moveToStarting11(playerName) {
      const current11Count = userTeam.squad.filter(p => p.inStarting11).length;
      if (current11Count >= 11) {
        alert("Əsas heyətdə artıq 11 oyunçu var! Öncə sahədən bir oyunçu çıxarın.");
        return;
      }
      const player = userTeam.squad.find(p => p.name === playerName);
      player.inStarting11 = true;
      updateUI();
    }

    function renderMarket() {
      const tbody = document.getElementById("transferMarketTable");
      tbody.innerHTML = "";

      db.countries.forEach(c => {
        c.teams.forEach(t => {
          if (t.id !== userTeam.id) {
            t.squad.forEach((p, idx) => {
              tbody.innerHTML += `
                <tr class="market-row">
                  <td><b>${p.name}</b></td>
                  <td>${t.name}</td>
                  <td>${p.pos}</td>
                  <td>${p.rating}</td>
                  <td>$${p.value}M</td>
                  <td><button class="btn" onclick="buyPlayer(${t.id}, ${idx})">Al</button></td>
                </tr>
              `;
            });
          }
        });
      });
    }

    function filterMarket() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const rows = document.querySelectorAll(".market-row");
      rows.forEach(row => {
        const text = row.innerText.toLowerCase();
        row.style.display = text.includes(input) ? "" : "none";
      });
    }

    function buyPlayer(teamId, pIdx) {
      let seller = null;
      db.countries.forEach(c => {
        const found = c.teams.find(t => t.id === teamId);
        if(found) seller = found;
      });

      const p = seller.squad[pIdx];
      if (userTeam.budget < p.value) {
        alert("Büdcəniz yetərli deyil!");
        return;
      }

      userTeam.budget -= p.value;
      p.inStarting11 = false;
      userTeam.squad.push(p);
      seller.squad.splice(pIdx, 1);

      alert(`${p.name} heyətinizə transfer edildi!`);
      updateUI();
    }

    // REALİSTİK GƏNC İNKİŞAF ALQORİTMİ (Balanslaşdırılmış)
    function growPlayers() {
      userTeam.squad.forEach(p => {
        if (p.age < 23 && p.rating < p.potential) {
          if (Math.random() < 0.2) p.rating += 1; // 20% ehtimalla çox yavaş artır
        } else if (p.age > 33) {
          if (Math.random() < 0.25) p.rating -= 1;
        }
      });
    }

    // QOL VURANLAR İLƏ DETALLI MATÇ SİMULYASİYASI
    function simulateMatch(home, away) {
      const homePower = calculateTeamRating(home) + 3;
      const awayPower = calculateTeamRating(away);
      let hG = 0, aG = 0;
      let scorers = [];

      for (let i = 0; i < 6; i++) {
        if (Math.random() * 100 < (homePower / (homePower + awayPower)) * 40) {
          hG++;
          const homeAttackers = home.squad.filter(p => p.inStarting11);
          const scorer = homeAttackers[Math.floor(Math.random() * homeAttackers.length)]?.name || "Oyunçu";
          scorers.push(`${home.name}: ${scorer} (${Math.floor(Math.random()*85)+1}')`);
        }
        if (Math.random() * 100 < (awayPower / (homePower + awayPower)) * 35) {
          aG++;
          const awayAttackers = away.squad.filter(p => p.inStarting11);
          const scorer = awayAttackers[Math.floor(Math.random() * awayAttackers.length)]?.name || "Oyunçu";
          scorers.push(`${away.name}: ${scorer} (${Math.floor(Math.random()*85)+1}')`);
        }
      }

      home.played++; away.played++;
      if (hG > aG) { home.points += 3; home.won++; away.lost++; }
      else if (aG > hG) { away.points += 3; away.won++; home.lost++; }
      else { home.points += 1; away.points += 1; home.drawn++; away.drawn++; }

      return { home: home.name, away: away.name, score: `${hG} - ${aG}`, scorers };
    }

    function playNextRound() {
      growPlayers();
      const resultsDiv = document.getElementById("matchResults");
      resultsDiv.innerHTML = "";

      db.countries.forEach(c => {
        if (c.teams.length >= 2) {
          const res = simulateMatch(c.teams[0], c.teams[1]);
          let goalsText = res.scorers.length > 0 ? `<br><small style="color:#8d99ae;">⚽ ${res.scorers.join(", ")}</small>` : "";
          resultsDiv.innerHTML += `
            <div style="background:#0b132b; padding:8px; border-radius:6px;">
              <b>[${c.name}]</b> ${res.home} <b>${res.score}</b> ${res.away} ${goalsText}
            </div>
          `;
        }
      });

      updateUI();
    }

    function renderStandings() {
      const tbody = document.getElementById("leagueStandingsTable");
      const sorted = [...userCountry.teams].sort((a,b) => b.points - a.points);
      tbody.innerHTML = "";
      sorted.forEach((t, i) => {
        const isUser = t.id === userTeam.id ? "style='background: #1c2541; font-weight:bold; color:var(--accent);'" : "";
        tbody.innerHTML += `
          <tr ${isUser}>
            <td>${i+1}</td>
            <td>${t.name}</td>
            <td>${t.played}</td>
            <td>${t.won}</td>
            <td>${t.drawn}</td>
            <td>${t.lost}</td>
            <td><b>${t.points}</b></td>
          </tr>
        `;
      });
    }

    updateTeamDropdown();
  </script>
</body>
</html>
